<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0c0c0e">
<title>Stranica zastarjela | Zastarjelo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%230c0c0e'/%3E%3Crect x='1' y='2' width='6' height='4' fill='%23f5c518'/%3E%3Crect x='3' y='3' width='2' height='2' fill='%23000'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Geist:wght@400;600&family=Geist+Mono:wght@500&display=swap">
<style>
  :root{
    color-scheme: dark;
    --bg:#0c0c0e;
    --line:#2e3035;
    --line-2:#43464d;
    --dim:#c0c3c9;
    --mute:#8b8f97;
    --white:#f6f6f3;
    --pen:#141414;
    --black:#000;
    --yellow:#f5c518;
    --yellow-d:#a67f00;
    --orange:#ec5b33;
    --pixel:"VT323", "Geist Mono", monospace;
    --sans:"Geist", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    --mono:"Geist Mono", ui-monospace, Consolas, monospace;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{overflow-x:clip}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--white);font:400 1rem/1.6 var(--sans);padding:2rem 16px}
  main{max-width:38rem}
  .code{font:500 .7rem/1 var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--orange)}
  h1{font:400 clamp(3rem, 10vw, 5rem)/.95 var(--pixel);margin:1rem 0 1.2rem}
  .mark{text-decoration:underline;text-decoration-color:var(--yellow);text-decoration-thickness:4px;text-underline-offset:.18em;text-decoration-skip-ink:none}
  p{color:var(--dim);margin:0;max-width:46ch}
  .ctas{display:flex;flex-wrap:wrap;gap:.9rem;margin-top:2rem}
  .btn{display:inline-flex;align-items:center;gap:.5rem;font:600 .92rem/1 var(--sans);padding:.85rem 1.1rem;border:2px solid var(--pen);background:var(--yellow);color:var(--pen);text-decoration:none;box-shadow:4px 4px 0 var(--yellow-d);transition:transform .15s cubic-bezier(.4,0,.2,1)}
  .btn:hover{transform:translate(-2px,-2px)}
  .btn:active{transform:translate(3px,3px)}
  .btn--ghost{background:var(--pen);color:var(--white);border-color:var(--line-2);box-shadow:4px 4px 0 var(--black)}
  :focus-visible{outline:2px solid var(--yellow);outline-offset:3px}
  .hazard{height:10px;margin-top:3rem;background:repeating-linear-gradient(-45deg, var(--yellow) 0 10px, var(--pen) 10px 20px);border:1px solid var(--line)}
  @media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<main>
  <p class="code">Greška 404 · stranica zastarjela</p>
  <h1>Ova stranica je <span class="mark">zastarjela</span>.</h1>
  <p>Na zadnjoj reviziji učinkovitosti proglašena je tehnološkim viškom. Radila je predano. Dobila je tortu i čestitku.</p>
  <div class="ctas">
    <a class="btn" href="/">Natrag na sigurno</a>
    <a class="btn btn--ghost" href="/#provjera">Jeste li i vi višak? →</a>
  </div>
  <div class="hazard" aria-hidden="true"></div>
</main>
</body>
</html>
